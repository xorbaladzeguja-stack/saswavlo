name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare icon for asset generation
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png

      - name: Generate app icon from logo
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1c0f30' --iconBackgroundColorDark '#1c0f30'

      - name: Add notification permissions to AndroidManifest
        run: python3 scripts/patch_manifest.py

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: damkhmare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
